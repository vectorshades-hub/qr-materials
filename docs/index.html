<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material QR — All Members</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #EEF2F7; min-height: 100vh; padding: 20px 16px 48px;
  }
  .header {
    background: linear-gradient(135deg, #1a4e79, #2576b5);
    color: white; border-radius: 16px; padding: 20px 18px;
    margin-bottom: 16px; box-shadow: 0 4px 16px rgba(26,78,121,.25);
  }
  .header h1 { font-size: 22px; font-weight: 700; }
  .header p  { font-size: 13px; opacity: .7; margin-top: 4px; }
  .search-wrap { position: relative; margin-bottom: 14px; }
  .search-wrap input {
    width: 100%; padding: 12px 16px 12px 42px;
    border: none; border-radius: 12px; font-size: 15px;
    background: white; box-shadow: 0 2px 8px rgba(0,0,0,.07); outline: none;
  }
  .search-icon {
    position: absolute; left: 14px; top: 50%;
    transform: translateY(-50%); color: #A0AEC0;
  }
  .count { font-size: 12px; color: #718096; margin-bottom: 10px; padding-left: 4px; }
  .list  { display: flex; flex-direction: column; gap: 8px; }
  .item {
    background: white; border-radius: 12px; padding: 14px 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
    display: flex; align-items: center; justify-content: space-between;
    text-decoration: none; color: inherit;
    transition: box-shadow .15s, transform .1s;
  }
  .item:active { transform: scale(.98); }
  .item-left h3 { font-size: 16px; font-weight: 700; color: #1a4e79; }
  .item-left p  { font-size: 12px; color: #718096; margin-top: 2px; }
  .item-badge {
    background: #EBF4FF; color: #1a4e79; border-radius: 8px;
    padding: 4px 10px; font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  .empty  { text-align: center; color: #A0AEC0; padding: 40px 20px; font-size: 14px; }
  #loading { text-align: center; color: #718096; padding: 60px 20px; font-size: 15px; }
</style>
</head>
<body>
<div class="header">
  <h1>Material Members</h1>
  <p>Tap any member to view details &amp; save to Excel</p>
</div>
<div class="search-wrap">
  <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24"
       fill="none" stroke="currentColor" stroke-width="2.5">
    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
  </svg>
  <input type="search" id="search" placeholder="Search piecemark or type..."
         oninput="filterList()">
</div>
<div class="count" id="count"></div>
<div class="list"  id="list">
  <div id="loading">Loading members...</div>
</div>

<script>
// Same dynamic base URL trick — works on GitHub Pages and locally
var BASE_URL    = window.location.origin + window.location.pathname
                  .split("/").slice(0, -1).join("/");
var MEMBERS_URL = BASE_URL + "/members.json";

var allMembers = [];

fetch(MEMBERS_URL)
  .then(function(r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  })
  .then(function(members) {
    allMembers = members;
    renderList(members);
  })
  .catch(function(e) {
    document.getElementById("loading").innerHTML =
      "&#9888; Could not load members.json<br><small>" + e.message + "</small>";
  });

function renderList(members) {
  var list  = document.getElementById("list");
  var count = document.getElementById("count");
  list.innerHTML = "";
  count.textContent = members.length + " member" + (members.length !== 1 ? "s" : "");

  if (!members.length) {
    list.innerHTML = '<div class="empty">No members found</div>';
    return;
  }

  for (var i = 0; i < members.length; i++) {
    var m    = members[i];
    var pm   = m.piecemark   || "N/A";
    var type = m.type        || "N/A";
    var grade  = m.grade     || "";
    var length = m.length    || "";
    var section = m.section_size || "";

    var sub = [type, grade, length].filter(Boolean).join(" \u2022 ");

    var a = document.createElement("a");
    a.className = "item";
    a.href = "member.html?id=" + encodeURIComponent(pm);
    a.innerHTML =
      '<div class="item-left">' +
        '<h3>' + pm + '</h3>' +
        '<p>' + sub + (section ? ' &bull; ' + section : '') + '</p>' +
      '</div>' +
      '<span class="item-badge">' + type + '</span>';
    list.appendChild(a);
  }
}

function filterList() {
  var q = document.getElementById("search").value.toLowerCase();
  if (!q) { renderList(allMembers); return; }
  var filtered = [];
  for (var i = 0; i < allMembers.length; i++) {
    var m = allMembers[i];
    if ((m.piecemark   ||"").toLowerCase().indexOf(q) !== -1 ||
        (m.type        ||"").toLowerCase().indexOf(q) !== -1 ||
        (m.grade       ||"").toLowerCase().indexOf(q) !== -1 ||
        (m.section_size||"").toLowerCase().indexOf(q) !== -1) {
      filtered.push(m);
    }
  }
  renderList(filtered);
}
</script>
</body>
</html>
