<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Details</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #EEF2F7;
    min-height: 100vh;
    padding: 20px 16px 48px;
  }

  .header {
    background: linear-gradient(135deg, #1a4e79, #2576b5);
    color: white;
    border-radius: 16px;
    padding: 20px 18px 16px;
    margin-bottom: 14px;
    box-shadow: 0 4px 16px rgba(26,78,121,.25);
  }
  .header h1  { font-size: 24px; font-weight: 700; letter-spacing: .3px; }
  .header p   { font-size: 13px; opacity: .75; margin-top: 3px; }
  .badge {
    display: inline-block;
    background: rgba(255,255,255,.18);
    border-radius: 20px;
    padding: 3px 12px;
    font-size: 12px;
    font-weight: 600;
    margin-top: 10px;
    letter-spacing: .4px;
  }

  .card {
    background: white;
    border-radius: 14px;
    box-shadow: 0 2px 12px rgba(0,0,0,.07);
    overflow: hidden;
    margin-bottom: 14px;
  }

  table { width: 100%; border-collapse: collapse; }
  tr:nth-child(even) td { background: #F6F9FD; }
  td {
    padding: 11px 16px;
    font-size: 14px;
    border-bottom: 1px solid #EEF2F7;
    vertical-align: top;
  }
  td:first-child {
    font-weight: 600;
    color: #4A5568;
    width: 42%;
    white-space: nowrap;
  }
  td:last-child { color: #1A202C; }

  .actions { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
    text-decoration: none;
    color: white;
  }
  .btn:active { opacity: .85; transform: scale(.98); }
  .btn-excel  { background: #1e7e45; }
  .btn-index  {
    background: white;
    color: #1a4e79;
    border: 2px solid #1a4e79;
    font-size: 13px;
    padding: 11px;
  }

  .note {
    text-align: center;
    font-size: 11px;
    color: #A0AEC0;
    margin-top: 6px;
  }

  /* Toast notification */
  .toast {
    position: fixed;
    bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #2D3748;
    color: white;
    padding: 11px 22px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    box-shadow: 0 4px 16px rgba(0,0,0,.25);
    transition: transform .3s ease;
    z-index: 999;
  }
  .toast.show   { transform: translateX(-50%) translateY(0); }
  .toast.success { background: #276749; }
  .toast.error   { background: #9B2C2C; }

  /* Loading state */
  #loading {
    text-align: center;
    padding: 60px 20px;
    color: #718096;
    font-size: 15px;
  }
  #content { display: none; }
</style>
</head>
<body>

<div id="loading">Loading member data...</div>

<div id="content">
  <div class="header">
    <h1 id="h-pm"></h1>
    <p>Material Details</p>
    <span class="badge" id="h-type"></span>
  </div>

  <div class="card">
    <table id="detail-table"></table>
  </div>

  <div class="actions">
    <button class="btn btn-excel" onclick="saveExcel()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Save to Excel (.csv)
    </button>
    <p class="note">Saves to Downloads &bull; Opens directly in Microsoft Excel</p>
    <a class="btn btn-index" href="index.html">&#8592; Back to All Members</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Read piecemark from URL: member.html?id=14C2 ──────────────────────────
var params   = new URLSearchParams(window.location.search);
var id       = params.get("id");

var FIELDS = [
  ["Type",       "type"],
  ["Section",    "section_type"],
  ["Grade",      "grade"],
  ["Length",     "length"],
  ["Depth",      "depth"],
  ["Thickness",  "thick"],
  ["Weight",     "weight"],   // will append " plf"
  ["Galvanized", "is_galvanized"],
  ["Left Conn",  "left_conn"],
  ["Right Conn", "right_conn"],
];

// ── Load members.json and find this member ────────────────────────────────
fetch("members.json")
  .then(function(r) { return r.json(); })
  .then(function(members) {
    var member = null;
    for (var i = 0; i < members.length; i++) {
      if (members[i].piecemark === id) { member = members[i]; break; }
    }
    if (!member) {
      document.getElementById("loading").textContent =
        "Member \"" + id + "\" not found.";
      return;
    }

    // Fill header
    document.getElementById("h-pm").textContent   = member.piecemark;
    document.getElementById("h-type").textContent = member.type || "";

    // Fill table
    var tbody = document.getElementById("detail-table");
    FIELDS.forEach(function(pair) {
      var label = pair[0], key = pair[1];
      var val   = member[key] || "N/A";
      if (key === "weight" && val !== "N/A") val += " plf";
      var tr    = document.createElement("tr");
      tr.innerHTML = "<td>" + label + "</td><td>" + val + "</td>";
      tbody.appendChild(tr);
    });

    // Store member for CSV export
    window._member = member;

    document.getElementById("loading").style.display = "none";
    document.getElementById("content").style.display = "block";
    document.title = member.piecemark + " — Material Details";
  })
  .catch(function(e) {
    document.getElementById("loading").textContent =
      "Error loading data. Make sure members.json is in the same folder.";
  });

// ── CSV / Excel export ────────────────────────────────────────────────────
function saveExcel() {
  var m = window._member;
  if (!m) return;

  // Build CSV rows — headers then values
  var headers = ["Piecemark","Type","Section","Grade","Length","Depth",
                 "Thickness","Weight (plf)","Galvanized","Left Conn","Right Conn"];
  var values  = [
    m.piecemark, m.type, m.section_type, m.grade, m.length,
    m.depth, m.thick, m.weight, m.is_galvanized, m.left_conn, m.right_conn
  ].map(function(v) { return '"' + String(v || "N/A").replace(/"/g, '""') + '"'; });

  var csv  = headers.join(",") + "\n" + values.join(",");
  var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement("a");
  a.href     = url;
  a.download = m.piecemark + ".csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  showToast("Saved " + m.piecemark + ".csv to Downloads", "success");
}

// ── Toast helper ──────────────────────────────────────────────────────────
function showToast(msg, type) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.className   = "toast show " + (type || "");
  setTimeout(function() { t.className = "toast"; }, 3000);
}
</script>
</body>
</html>
